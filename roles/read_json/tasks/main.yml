- name: Prepare vars
  set_fact:
    success_list: []
    failure_list: []
  become: yes

- name: Copy file
  copy:
    src: files/data.json
    dest: "/tmp/dp/data.json"
  become: yes

- name: Read json
  slurp:
    src: "/tmp/dp/data.json"
  register: data_file
  become: yes

- name: Covert JSON
  set_fact:
    data: "{{ data_file['content'] | b64decode | from_json }}"
  become: yes

# - name: Extract one dp
#   set_fact:
#     dp: "{{ data.resources | selectattr('dp3', 'defined') | map(attribute='dp3') | list }}"
#   become: yes

- name: Load variables from JSON
  include_vars:
    file: files/data.json

- name: Display sources
  debug:
    var: sources
  become: yes

- name: Run task file only for sources that are enabled
  include_tasks: "tasks/01_flow.yml"
  loop: "{{ sources | map('dict2items') | map('first') | list }}"
  loop_control:
    loop_var: source
  when: source.value.skip_generic_flow | default("no") == "no"
  vars:
    dp: "{{ source.value }}"
    dp_name: "{{ source.key }}"
  register: task_results

- name: Debug task_results
  debug:
    msg: "task_results: {{ task_results }}"

- name: Update success_list
  set_fact:
    success_list: "{{ success_list + [item.item.name] }}"
  with_items: "{{ task_results.results }}"
  when: item.stat.exists

- name: Update failure_list
  set_fact:
    failure_list: "{{ failure_list + [item.item.name] }}"
  with_items: "{{ task_results.results }}"
  when: not item.stat.exists

- name: Print summary
  debug:
    msg: |
      Summary:
      Successful entries: {{ success_list }}
      Failed entries: {{ failure_list }}


