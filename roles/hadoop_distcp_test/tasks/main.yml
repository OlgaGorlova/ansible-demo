- name: Run distcp via hdfs1-namenode
  command: >
    docker exec hdfs1-namenode
    hadoop distcp
    hdfs://hdfs1-nn:8020/data
    hdfs://hdfs2-nn:8020/data
  loop: "{{ sources }}"
  loop_control:
    index_var: item_index
  become: yes
